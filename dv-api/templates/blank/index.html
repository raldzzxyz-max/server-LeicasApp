<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading</title>
<style>
body{margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#111;color:#fff;font-family:sans-serif}
.loader{text-align:center}
.spinner{width:40px;height:40px;border:3px solid #333;border-top-color:#00b4d8;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="loader">
<div class="spinner"></div>
<p>Loading...</p>
</div>
</body>
</html>
