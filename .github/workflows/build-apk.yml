name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build ID'
        required: true
      config_json:
        description: 'Config JSON (base64)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download tools
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          wget -q https://github.com/nicsto/apksigner/releases/download/v0.5/apksigner.jar -O apksigner.jar || wget -q https://github.com/nicsto/apksigner/releases/latest/download/apksigner.jar -O apksigner.jar || true
          chmod +x apktool.jar

      - name: Decode config
        run: |
          echo "${{ inputs.config_json }}" | base64 -d > build_config.json
          echo "=== Config ==="
          cat build_config.json

      - name: Select base APK
        run: |
          TYPE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('build_config.json')).type)")
          echo "Build type: $TYPE"
          if [ "$TYPE" = "rat" ]; then
            if [ -f base-apk/bpish-base.zip ]; then
              unzip -o base-apk/bpish-base.zip -d base-apk/
            fi
            cp base-apk/bpish-base.apk base.apk
          else
            cp base-apk/pising-base.apk base.apk
          fi
          ls -la base.apk

      - name: Decompile APK
        run: |
          java -jar apktool.jar d base.apk -o tmp/app -f
          echo "=== Decompiled ==="
          ls tmp/app/

      - name: Modify resources
        run: node scripts/modify-apk.js build_config.json tmp/app

      - name: Recompile APK
        run: |
          java -jar apktool.jar b tmp/app -o unsigned.apk
          ls -la unsigned.apk

      - name: Align APK
        run: |
          if command -v zipalign &> /dev/null; then
            zipalign -f 4 unsigned.apk aligned.apk
            cp aligned.apk signed.apk
          else
            cp unsigned.apk signed.apk
          fi

      - name: Sign APK
        run: |
          if [ -f apksigner.jar ]; then
            java -jar apksigner.jar sign \
              --ks keystore/release.jks \
              --ks-pass pass:leicasbuild2024 \
              --key-alias key0 \
              --key-pass pass:leicasbuild2024 \
              signed.apk || cp unsigned.apk signed.apk
          else
            cp unsigned.apk signed.apk
          fi

      - name: Get APK info
        id: apkinfo
        run: |
          APP_NAME=$(node -e "console.log(JSON.parse(require('fs').readFileSync('build_config.json')).appName)")
          BUILD_ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('build_config.json')).buildId)")
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          FINAL_NAME="${APP_NAME}_${BUILD_ID}"
          mv signed.apk "${FINAL_NAME}.apk"
          ls -la "${FINAL_NAME}.apk"
          echo "final_name=$FINAL_NAME" >> $GITHUB_OUTPUT

      - name: Upload to Releases
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ steps.apkinfo.outputs.build_id }}
          name: "Build ${{ steps.apkinfo.outputs.build_id }}"
          files: "${{ steps.apkinfo.outputs.final_name }}.apk"
          body: |
            App: ${{ steps.apkinfo.outputs.app_name }}
            Build ID: ${{ steps.apkinfo.outputs.build_id }}
            Type: Custom Build
